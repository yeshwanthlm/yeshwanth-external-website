<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>inbox · admin · yeshwanthlm.in</title>
  <link rel="icon" href="/assets/img/favicon.png">
  <script src="/assets/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="admin-page">
  <div class="grain" aria-hidden="true"></div>

  <header class="nav scrolled">
    <a class="logo" href="/" aria-label="Back to the site">
      <img class="logo__img" src="/assets/img/mascot.png" alt="" width="56" height="56">
      <span class="logo__txt">Yeshwanth<span class="logo__cur" aria-hidden="true">_</span></span>
    </a>
    <nav aria-label="Admin"><ul class="nav__links"><li><a href="/">← Back to site</a></li></ul></nav>
    <div class="nav__right">
      <span class="who mono" id="who" hidden></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light and dark theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn btn--sm btn--ghost" id="logout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main class="wrap adm">
    <p class="label">// admin · inbox</p>
    <h1 class="h2">Messages from <em>the site.</em></h1>

    <!-- signed out / not deployed -->
    <section class="adm__gate" id="gate" hidden></section>

    <!-- signed in -->
    <section id="inbox" hidden>
      <div class="adm__stats" id="stats"></div>
      <div class="adm__bar">
        <label class="vsearch"><span class="mono" aria-hidden="true">/</span><input id="q" type="search" placeholder="Search name, email or message" aria-label="Search messages"></label>
        <div class="tabs" role="tablist" aria-label="Filter" id="filters"></div>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
        </button>
      </div>
      <p class="gitline mono" id="status"></p>
      <ol class="msgs" id="list" aria-live="polite"></ol>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
